<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { width: 100px; height: 145px; margin: 0; overflow: hidden; background: transparent; }
      #tile { width: 100px; height: 145px; background: url('../public/assets/tiles/tile-base-v1.png') center -2px / 100px 150px no-repeat; }
      img { display: block; width: 100%; height: 145px; }
    </style>
  </head>
  <body>
    <div id="tile"><img alt="" /></div>
    <script>
      const code = new URLSearchParams(location.search).get('code') || '1m';
      document.querySelector('img').src = `../public/assets/tiles/${code}.svg`;
    </script>
  </body>
</html>
